name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you redeploy by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`, on purpose.
      #
      # npm writes some of esbuild's per-platform optional packages into the
      # lockfile *without* their `optional: true` flag (only the copy for the
      # platform that generated the lock gets flagged). `npm ci` then treats
      # e.g. @esbuild/netbsd-arm64 as required and dies with EBADPLATFORM on
      # the Linux runner. `npm install` re-resolves optional deps per platform
      # and installs the right binaries.
      - run: npm install --no-audit --no-fund

      # `npm run build` is typecheck + vite build, so a type error fails the
      # deploy instead of shipping a broken page.
      - run: npm run build

      - run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
